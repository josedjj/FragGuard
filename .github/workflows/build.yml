# Compila y prueba FragGuard en cada push y pull request, y guarda los binarios publicados como artefacto.
# Es también la base para firmar con SignPath: firman lo que sale de aquí, compilado desde el código público.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore FragGuard.sln

      - name: Compilar
        run: dotnet build FragGuard.sln -c Release --no-restore

      - name: Tests
        run: dotnet test FragGuard.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Generar instalador (sin firmar)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -NoSign

      - name: Guardar instalador (sin firmar)
        uses: actions/upload-artifact@v4
        with:
          name: FragGuard-Setup-unsigned
          path: artifacts/installer/
          if-no-files-found: error

      - name: Guardar resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
